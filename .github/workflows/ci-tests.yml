name: C++ CI Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  added-lines:
    name: Check added lines against the 80-column rules
    runs-on: ubuntu-latest
    steps:
    # The whole history, so the base of the pushed range exists here.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # A push checks what it added since the branch's last tip, and a pull
    # request what it adds to its base. A new branch or a manual run has no
    # base, so its last commit is checked.
    - name: Check the lines the range adds
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        no_commit=0000000000000000000000000000000000000000
        if [ "$EVENT_NAME" = "pull_request" ]; then
          base="$PULL_REQUEST_BASE"
        elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] &&
          [ "$PUSH_BEFORE" != "$no_commit" ]; then
          base="$PUSH_BEFORE"
        else
          base="$(git rev-parse HEAD^)"
        fi
        python3 docs/comment_width_check.py --range "$base..HEAD"

  build-and-test:
    name: Build and Run Tests
    runs-on: windows-latest
    # The runner image carries a vcpkg of its own at C:\vcpkg, which moves whenever GitHub
    # updates the image. The pinned copy lives beside it, never in it.
    env:
      PINNED_VCPKG: C:\vcpkg-pinned
      # vcpkg writes each library it builds to this directory as a zip, and reads one back
      # instead of building whenever the zip's ABI hash matches. The cache steps below
      # carry the directory from one run to the next.
      VCPKG_ARCHIVES: C:\vcpkg-archives
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-archives,readwrite

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # vcpkg is checked out at the commit vcpkg.json names, so every run builds the same
    # library versions the last one did. The commit lives in vcpkg.json alone; moving it
    # there is how the libraries are upgraded, locally and here at once.
    - name: Setup vcpkg
      run: |
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        if (-not $baseline) { throw "vcpkg.json names no builtin-baseline to pin vcpkg to" }
        git clone https://github.com/Microsoft/vcpkg.git $env:PINNED_VCPKG
        if ($LASTEXITCODE -ne 0) { exit 1 }
        git -C $env:PINNED_VCPKG checkout $baseline
        if ($LASTEXITCODE -ne 0) { exit 1 }
        & "$env:PINNED_VCPKG\bootstrap-vcpkg.bat"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    # Keyed on vcpkg.json, which holds both the pinned baseline and the dependency list, so
    # the archives are reused until either changes. A miss still restores the newest older
    # set, and vcpkg takes from it whatever still matches.
    - name: Restore vcpkg archives
      id: restore-vcpkg-archives
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_ARCHIVES }}
        key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-archives-${{ runner.os }}-

    - name: Configure CMake
      run: |
        New-Item -ItemType Directory -Force -Path $env:VCPKG_ARCHIVES | Out-Null
        cmake -B build -S . -DBUILD_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:PINNED_VCPKG\scripts\buildsystems\vcpkg.cmake"

    # Saved straight after the configure that built them, so a later failing test does not
    # throw the build away. Only on a miss: a cache key is written once and never replaced.
    - name: Save vcpkg archives
      if: steps.restore-vcpkg-archives.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_ARCHIVES }}
        key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

    - name: Build tests (Debug)
      run: |
        cmake --build build --config Debug --target test_exe

    # The exit code and the tail of the output go to the job summary, which the Actions
    # API serves without the admin rights a job log needs. pwsh rewrites every non-zero
    # code to 1 of its own accord, and the real one names the fault: 3 is an abort,
    # 3221225477 an access violation, 3221226505 a stack-buffer or fastfail check.
    - name: Run tests (Debug)
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        cd build\bin\Debug
        .\test_exe.exe > test_stdout.txt 2> test_stderr.txt
        $code = $LASTEXITCODE
        Get-Content test_stdout.txt
        Get-Content test_stderr.txt
        "test_exe (Debug) exit code: $code" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($code -ne 0) {
          Get-Content test_stdout.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content test_stderr.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }
        exit $code

    # The game ships as Release, where NDEBUG compiles every assert out along with any call
    # written inside one. The Debug run executes those calls and cannot see the difference,
    # so the same suite runs again in the configuration players get. The assert probes skip
    # themselves here by design.
    - name: Build tests (Release)
      run: |
        cmake --build build --config Release --target test_exe

    - name: Run tests (Release)
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        cd build\bin\Release
        .\test_exe.exe > test_stdout.txt 2> test_stderr.txt
        $code = $LASTEXITCODE
        Get-Content test_stdout.txt
        Get-Content test_stderr.txt
        "test_exe (Release) exit code: $code" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($code -ne 0) {
          Get-Content test_stdout.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content test_stderr.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }
        exit $code

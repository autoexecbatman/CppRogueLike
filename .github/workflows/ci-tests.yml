name: C++ CI Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: windows-latest
    # The runner image carries a vcpkg of its own at C:\vcpkg, which moves whenever GitHub
    # updates the image. The pinned copy lives beside it, never in it.
    env:
      PINNED_VCPKG: C:\vcpkg-pinned

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # vcpkg is checked out at the commit vcpkg.json names, so every run builds the same
    # library versions the last one did. The commit lives in vcpkg.json alone; moving it
    # there is how the libraries are upgraded, locally and here at once.
    - name: Setup vcpkg
      run: |
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        if (-not $baseline) { throw "vcpkg.json names no builtin-baseline to pin vcpkg to" }
        git clone https://github.com/Microsoft/vcpkg.git $env:PINNED_VCPKG
        if ($LASTEXITCODE -ne 0) { exit 1 }
        git -C $env:PINNED_VCPKG checkout $baseline
        if ($LASTEXITCODE -ne 0) { exit 1 }
        & "$env:PINNED_VCPKG\bootstrap-vcpkg.bat"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Configure CMake
      run: |
        cmake -B build -S . -DBUILD_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:PINNED_VCPKG\scripts\buildsystems\vcpkg.cmake"

    - name: Build tests
      run: |
        cmake --build build --config Debug --target test_exe

    # The exit code and the tail of the output go to the job summary, which the Actions
    # API serves without the admin rights a job log needs. pwsh rewrites every non-zero
    # code to 1 of its own accord, and the real one names the fault: 3 is an abort,
    # 3221225477 an access violation, 3221226505 a stack-buffer or fastfail check.
    - name: Run tests
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        cd build\bin\Debug
        .\test_exe.exe > test_stdout.txt 2> test_stderr.txt
        $code = $LASTEXITCODE
        Get-Content test_stdout.txt
        Get-Content test_stderr.txt
        "test_exe exit code: $code" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($code -ne 0) {
          Get-Content test_stdout.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content test_stderr.txt -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }
        exit $code
